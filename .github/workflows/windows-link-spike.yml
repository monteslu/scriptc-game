name: windows link spike

on:
  workflow_dispatch:
  push:
    branches:
      - fix/windows-x86-build
    paths:
      - ".github/workflows/windows-link-spike.yml"

jobs:
  hybrid-link:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable the MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0

      - name: Read dependency pins
        id: pins
        shell: bash
        run: |
          node -e '
            const v = require("./versions.json");
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `scriptc_repo=${v.scriptc.fork}\n` +
              `scriptc_branch=${v.scriptc.branch}\n` +
              `webaudio_repo=${v.webaudio.source}\n` +
              `webaudio_commit=${v.webaudio.commit}\n`);
          '

      - name: Checkout scriptc
        uses: actions/checkout@v7
        with:
          repository: monteslu/scriptc
          ref: ${{ steps.pins.outputs.scriptc_branch }}
          path: scriptc

      - name: Build scriptc
        working-directory: scriptc
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Checkout webaudio-node
        uses: actions/checkout@v7
        with:
          repository: monteslu/webaudio-node
          ref: ${{ steps.pins.outputs.webaudio_commit }}
          path: webaudio-node

      - name: Fetch SDL2 development files
        shell: bash
        run: |
          curl -fsSL -o /tmp/sdl.zip \
            https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-VC.zip
          unzip -q /tmp/sdl.zip -d "$GITHUB_WORKSPACE/sdl2"
          SDLDIR="$(find "$GITHUB_WORKSPACE/sdl2" -maxdepth 1 -type d -name 'SDL2-*' | head -1)"
          echo "SDL2_INCLUDE=$SDLDIR/include" >> "$GITHUB_ENV"
          echo "SDL2_LIB=$SDLDIR/lib/x64" >> "$GITHUB_ENV"

      - name: Fetch the MSVC Skia archives
        shell: bash
        run: ./scripts/fetch-archives.sh windows-x86_64

      - name: Show the toolchain and CRT search path
        shell: bash
        run: |
          clang++ --version
          zig version
          echo "LIB=$LIB"

      - name: Build the native libraries
        shell: bash
        env:
          WEBAUDIO_SRC: ${{ github.workspace }}/webaudio-node
        run: |
          ./scripts/build-webaudio.sh windows-x86_64
          ./scripts/build-shim.sh windows-x86_64

      - name: Link the canvas runtime with MinGW scriptc and MSVC Skia
        shell: bash
        env:
          WEBAUDIO_SRC: ${{ github.workspace }}/webaudio-node
          SCRIPTC_BIN: ${{ github.workspace }}/scriptc/packages/cli/dist/main.js
          SCRIPTC_CC: zigcc
          SCRIPTC_TARGET: x86_64-windows-gnu
        run: |
          node codegen/gen-ffi.js windows-x86_64 test/conformance.ts
          node -e '
            const fs = require("fs");
            const path = require("path");
            const manifestPath = "ffi/core.ffi.json";
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const lib = path.join(process.env.VCToolsInstallDir, "lib", "x64");
            manifest.libraries.push(
              path.join(lib, "libcmt.lib"),
              path.join(lib, "oldnames.lib"),
              path.join(lib, "libcpmt.lib"),
            );
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          '
          mkdir -p build
          node "$SCRIPTC_BIN" build test/conformance.ts \
            --ffi ffi/core.ffi.json -o build/conformance.exe

      - name: Headless canvas smoke test
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          mkdir -p test/out
          ./build/conformance.exe test/out
